name: Minne (midlertidig)

on: push

jobs:
  memory:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mål minnet før og etter
        run: |
          printf '# Todo\n\n## Viktig\n\n- [ ] Svar på e-posten\n- [ ] Ring legen\n- [x] Bestill time\n\n## Frister\n\n- [ ] Lever rapporten, frist 2026-11-01\n- [ ] Søknad (innen 2026-10-25)\n\n## Generelle\n\n- [ ] Gå gjennom ukenotatene\n- [ ] Rydd skrivebordet\n\n## Senere\n\n- [ ] Søk sommerjobb, frist 2027-04-01\n' > ~/todo.md
          mkdir -p build
          git show origin/main:main.swift > build/before.swift
          swiftc -O -swift-version 5 -target arm64-apple-macos14 build/before.swift -o build/before
          swiftc -O -swift-version 5 -target arm64-apple-macos14 $(find Sources -name '*.swift') -o build/after
          swiftc .github/memtool/mouse.swift -o build/mouse
          info=$(build/mouse 10 400 | tr '\n' ' ')
          echo "::notice title=Skjermer::$info"
          X=$(build/mouse 10 400 | awk '{print $1}')
          fp() { vmmap -summary "$1" 2>/dev/null | grep -E 'Physical footprint:' | head -1 | sed -E 's/ +/ /g'; }
          measure() {
            "$1" &
            pid=$!
            sleep 10
            idle=$(fp $pid)
            build/mouse $X 5 click > /dev/null; sleep 3
            opened=$(fp $pid)
            vmmap -summary $pid | awk '/^REGION TYPE/{on=1;next} on && NF>4 && $1!~/^=/' | sort -t' ' -k1,1 | head -60 > build/regions.txt
            grep -E 'MALLOC|IOSurface|CoreAnimation|CG |IOKit|__DATA|Stack|Memory Tag|Image IO|TOTAL' build/regions.txt | sed -E 's/ +/ /g' | head -14 | tr '\n' ';' | sed "s/^/::notice title=$2 åpen regioner::/"; echo
            build/mouse $X 5 click > /dev/null; sleep 1
            build/mouse 10 400 > /dev/null; sleep 3
            closed=$(fp $pid)
            echo "::notice title=$2 runde $3::lukket: $idle | åpen: $opened | lukket igjen: $closed"
            vmmap -summary $pid | grep -E 'IOSurface|CoreAnimation|CG raster|MALLOC_|TOTAL' | head -12
            kill "$pid"; sleep 2
          }
          for round in 1; do
            measure build/before Før $round
            measure build/after Etter $round
          done
