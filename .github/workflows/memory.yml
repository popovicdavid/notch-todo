name: Minne (midlertidig)

on: push

permissions:
  contents: write

jobs:
  memory:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mål minnet før og etter
        run: |
          printf '# Todo\n\n## Viktig\n\n- [ ] Svar på e-posten\n- [ ] Ring legen\n- [x] Bestill time\n\n## Frister\n\n- [ ] Lever rapporten, frist 2026-11-01\n- [ ] Søknad (innen 2026-10-25)\n\n## Generelle\n\n- [ ] Gå gjennom ukenotatene\n- [ ] Rydd skrivebordet\n\n## Senere\n\n- [ ] Søk sommerjobb, frist 2027-04-01\n' > ~/todo.md
          mkdir -p build
          git show origin/main:main.swift > build/before.swift
          swiftc -O -swift-version 5 -target arm64-apple-macos14 build/before.swift -o build/before
          swiftc -O -swift-version 5 -target arm64-apple-macos14 $(find Sources -name '*.swift') -o build/after
          swiftc .github/memtool/mouse.swift -o build/mouse
          info=$(build/mouse 10 400 | tr '\n' ' ')
          echo "::notice title=Skjermer::$info"
          X=$(build/mouse 10 400 | awk '{print $1}')
          fp() { vmmap -summary "$1" 2>/dev/null | grep -E 'Physical footprint:' | head -1 | sed -E 's/ +/ /g'; }
          measure() {
            "$1" &
            pid=$!
            sleep 10
            idle=$(fp $pid)
            build/mouse $X 5 click > /dev/null; sleep 6
            opened=$(fp $pid)
            wake=$(top -l 2 -s 10 -pid $pid -stats pid,cpu,idlew | tail -1 | awk '{print "cpu " $2 "%, idle wakeups " $3 " på 10 s"}')
            echo "::notice title=$2 åpen energi::$wake"
            win1=$(build/mouse $X 5 noclick-but-list $pid 2>/dev/null | grep vindu | tr '\n' ' ')
            build/mouse $X 5 click > /dev/null; sleep 1
            build/mouse 10 400 > /dev/null; sleep 6
            wake2=$(top -l 2 -s 10 -pid $pid -stats pid,cpu,idlew | tail -1 | awk '{print "cpu " $2 "%, idle wakeups " $3 " på 10 s"}')
            echo "::notice title=$2 lukket energi::$wake2"
            closed=$(fp $pid)
            win2=$(build/mouse 10 400 x $pid 2>/dev/null | grep vindu | tr '\n' ' ')
            [ "$3" = 1 ] && echo "::notice title=$2 vinduer::åpen: $win1 | lukket: $win2"
            mkdir -p ~/logs
            vmmap -summary $pid > ~/logs/$2-$3-vmmap.txt 2>&1
            heap -s $pid > ~/logs/$2-$3-heap.txt 2>&1 || heap $pid > ~/logs/$2-$3-heap.txt 2>&1
            footprint -v $pid > ~/logs/$2-$3-footprint.txt 2>&1
            echo "::notice title=$2 runde $3::lukket: $idle | åpen: $opened | lukket igjen: $closed"
            vmmap -summary $pid | grep -E 'IOSurface|CoreAnimation|CG raster|MALLOC_|TOTAL' | head -12
            kill "$pid"; sleep 2
          }
          for round in 1 2; do
            measure build/before Før $round
            measure build/after Etter $round
          done
      - name: Legg loggene på en egen gren
        if: always()
        run: |
          cd ~/logs
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "logger"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
