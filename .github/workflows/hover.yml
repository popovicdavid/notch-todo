name: Hover-måling (midlertidig)

on: push

jobs:
  hover:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mål CPU-tid når musa går over oppgavene
        run: |
          {
            printf '# Todo\n'
            for s in Viktig Frister Generelle Senere; do
              printf '\n## %s\n\n' $s
              for i in 1 2 3 4 5 6 7 8 9; do printf -- '- [ ] Oppgave %s nummer %d med litt lengre tekst, frist 2026-11-%02d\n' $s $i $i; done
            done
          } > ~/todo.md
          mkdir -p build
          git show origin/main:main.swift > build/before.swift
          swiftc -O -swift-version 5 -target arm64-apple-macos14 build/before.swift -o build/gammel
          git worktree add -q ../prev HEAD~1
          swiftc -O -swift-version 5 -target arm64-apple-macos14 $(find ../prev/Sources -name '*.swift') -o build/forrige
          swiftc -O -swift-version 5 -target arm64-apple-macos14 $(find Sources -name '*.swift') -o build/ny
          swiftc .github/memtool/mouse.swift -o build/mouse
          cpu() { ps -o cputime= -p "$1" | awk -F'[:.]' '{print ($1*60+$2)*100+$3}'; }
          measure() {
            "build/$1" &
            pid=$!
            sleep 6
            build/mouse 512 5 click; sleep 3
            build/mouse 512 400; sleep 2
            a=$(cpu $pid); sleep 10; b=$(cpu $pid)
            build/mouse 200 75; sleep 1
            c=$(cpu $pid); build/mouse sweep 15; d=$(cpu $pid)
            echo "::notice title=$1 runde $2::i ro 10 s: $(( (b-a)*10 )) ms CPU | musa over oppgavene 15 s: $(( (d-c)*10 )) ms CPU"
            kill $pid; sleep 2
          }
          for r in 1 2; do measure gammel $r; measure forrige $r; measure ny $r; done
